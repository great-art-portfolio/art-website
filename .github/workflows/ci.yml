name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Check every push + PR. Deploys are the Pages dashboard's job
  # (git-connected: build on push, previews per PR).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm astro check
      - run: pnpm typecheck
      - run: pnpm test:unit
      # check:inline scans dist/, so the build comes first.
      - run: pnpm build
      - run: pnpm check:inline

  # Smoke tests against the real Pages runtime (static + Functions,
  # no secrets): regressions, validation paths, graceful fallbacks.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Local D1 tables for the collector tests — .wrangler/ is gitignored,
      # so a clean runner has no tables without this.
      - run: pnpm db:migrate:local
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
