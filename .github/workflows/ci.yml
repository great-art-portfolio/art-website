name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes the older run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, gate order: install once, share one dist, fail fast.
  # Deploys are the Pages dashboard's job (git-connected: build on push,
  # previews per PR).
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm astro check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      # check:inline scans dist/, so the build comes first.
      - run: pnpm check:inline
      # Local D1 tables for the collector tests — .wrangler/ is gitignored,
      # so a clean runner has no tables without this.
      - run: pnpm db:migrate:local
      # The email-list specs round-trip the dev mock, never Resend — the
      # flag is local-only (localhost rail), and the runner is local, so
      # set it the way .dev.vars does. Without it every subscribe 500s.
      - run: printf 'COLLECTORS_MOCK=true\n' > .dev.vars
      # Smoke tests against the real Pages runtime (static + Functions,
      # no secrets): regressions, validation paths, graceful fallbacks.
      # Google's Chrome repo regularly serves a stale Packages index
      # (Hash Sum mismatch), failing apt update before any gate runs —
      # and it survived a filename-based removal, so it lives under a
      # different name. We don't need system Chrome (Playwright brings
      # Chromium), so drop every source pointing at it by URL, then
      # still retry the install for real blips.
      - run: |
          sudo grep -rl "dl.google.com" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list
          for i in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then
              break
            fi
            test "$i" = 3 && exit 1
            sleep 15
          done
      - run: pnpm exec playwright test
