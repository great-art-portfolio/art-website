<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" fill="none">
  <!-- Guide wash: a faint dashed route with waypoints, like directions
       sketched on the back of a receipt — same warm palette as
       background-warm. No neon, no purple/blue. -->
  <defs>
    <radialGradient id="gui-pool" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#E9DBC0" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#EFE3CC" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#EFE3CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gui-drift" x1="0" y1="0" x2="1440" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F1E7D4" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#F1E7D4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#E5DCCB" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="gui-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.41  0 0 0 0 0.35  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1440" height="1024" fill="url(#gui-drift)"/>
  <ellipse cx="700" cy="220" rx="700" ry="340" fill="url(#gui-pool)"/>

  <!-- The route: one dashed wander with three stops -->
  <path d="M180 780 C 420 760, 480 560, 720 560 S 1080 660, 1260 480"
    stroke="#756A5C" stroke-width="1.4" stroke-dasharray="2 9"
    stroke-linecap="round" fill="none" stroke-opacity="0.16"/>
  <g stroke="#756A5C" stroke-width="1.2" fill="none" stroke-opacity="0.14">
    <circle cx="180" cy="780" r="7"/>
    <circle cx="720" cy="560" r="7"/>
    <circle cx="1260" cy="480" r="7"/>
  </g>

  <rect x="0" y="0" width="1440" height="1024" filter="url(#gui-grain)" opacity="0.5"/>
</svg>
