name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Check every push + PR. Deploys are the Pages dashboard's job
  # (git-connected: build on push, previews per PR).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm astro check
      - run: pnpm build
