# Generated by Wrangler on Sun Mar 23 2025 23:15:39 GMT-0600 (Mountain Daylight Time)
name = "art-website"
pages_build_output_dir = "dist"
compatibility_date = "2025-03-20"

[vars]
NODE_VERSION = "22.12.0"
# Git publishing: /admin commits paintings + banner to this repo (token itself
# is a secret: `pnpm wrangler pages secret put GITHUB_TOKEN --project-name=art-website`).
GITHUB_REPO = "great-art-portfolio/art-website"
GITHUB_BRANCH = "main"
# Feature flags. Keep "false" until ready to enable each one.
ENABLE_STRIPE = "false"
ENABLE_SHIPPO = "false"
ENABLE_SOCIAL_POST = "false"
# Free push channel: create a private topic in the ntfy iOS app, then set it here.
NTFY_TOPIC = "art-gallery-inquiries"
# Non-secret service config. Secrets (tokens, private inbox) stay in the
# dashboard / `wrangler pages secret put` — never here, this file is git.
VAPID_PUBLIC_KEY = "BLCBFf14oWxzjSGDFknG-5K8UvhbcUnw7-ewBy-rmVgS6ME9Z9KDkFJBBKW2C9EQAUlGNgy-H8TnMmA6GiDgBzY"
# VAPID_CONTACT = "mailto:hello@yourdomain.ca"  # abuse contact for push services
NOTIFY_EMAIL_FROM = "Gallery <onboarding@resend.dev>"  # free tier; switch to your own domain when you have one
# TURNSTILE_SITE_KEY = ""  # public by design; empty = honeypot only

[[d1_databases]]
binding = "DB"
database_name = "art-gallery-db"
database_id = "108c5dee-b1a6-4837-8afb-6b2f0b4410ba"
# R2 is gone: painting photos live in git (responsive via astro:image),
# AR models in public/models. The bucket can be deleted in the dashboard.

[env.production.vars]
NODE_VERSION = "22.12.0"
ENABLE_STRIPE = "false"
ENABLE_SHIPPO = "false"
ENABLE_SOCIAL_POST = "false"
NTFY_TOPIC = "art-gallery-inquiries"
# Non-secret service config. Secrets (tokens, private inbox) stay in the
# dashboard / `wrangler pages secret put` — never here, this file is git.
VAPID_PUBLIC_KEY = "BLCBFf14oWxzjSGDFknG-5K8UvhbcUnw7-ewBy-rmVgS6ME9Z9KDkFJBBKW2C9EQAUlGNgy-H8TnMmA6GiDgBzY"
# VAPID_CONTACT = "mailto:hello@yourdomain.ca"  # abuse contact for push services
NOTIFY_EMAIL_FROM = "Gallery <onboarding@resend.dev>"  # free tier; switch to your own domain when you have one
# TURNSTILE_SITE_KEY = ""  # public by design; empty = honeypot only

# Secrets (set in the Cloudflare dashboard, never committed):
#   VAPID_PUBLIC_KEY    - actually public: also served via GET /api/push
#   VAPID_PRIVATE_JWK   - secret JSON from `node scripts/gen-vapid.mjs`
#   VAPID_CONTACT       - plain var, e.g. mailto:you@example.com
#   TURNSTILE_SITE_KEY  - plain var from Security > Turnstile > Add site
#   TURNSTILE_SECRET_KEY - secret from the same Turnstile widget
#   RESEND_API_KEY      - Resend API key for buyer-inquiry emails
#   NOTIFY_EMAIL_FROM   - e.g. "Gallery <hello@yourdomain.ca>"
#   NOTIFY_EMAIL_TO     - your mom's email address
#   ADMIN_API_TOKEN     - shared secret for /admin API calls (defense in depth behind Access)
#   PUSHOVER_APP_TOKEN / PUSHOVER_USER_KEY - optional, if she prefers Pushover over ntfy
#   STRIPE_SECRET_KEY   - only when ENABLE_STRIPE = "true"
#   SHIPPO_API_TOKEN    - only when ENABLE_SHIPPO = "true"
#   AYRSHARE_API_KEY    - only when ENABLE_SOCIAL_POST = "true"
