# Generated by Wrangler on Sun Mar 23 2025 23:15:39 GMT-0600 (Mountain Daylight Time)
name = "art-website"
pages_build_output_dir = "dist"
compatibility_date = "2025-03-20"

[vars]
NODE_VERSION = "22.12.0"
# Git publishing: /admin commits paintings + banner to this repo (token itself
# is a secret: `pnpm wrangler pages secret put GITHUB_TOKEN --project-name=art-website`).
GITHUB_REPO = "great-art-portfolio/art-website"
GITHUB_BRANCH = "main"
# Feature flags. Keep "false" until ready to enable each one.
ENABLE_STRIPE = "false"
ENABLE_SHIPPO = "false"
ENABLE_SOCIAL_POST = "false"
# Free push channel: create a private topic in the ntfy iOS app, then set it here.
NTFY_TOPIC = "art-gallery-inquiries"
# Non-secret service config. Secrets (tokens, private inbox) stay in the
# dashboard / `wrangler pages secret put` — never here, this file is git.
VAPID_PUBLIC_KEY = "BLCBFf14oWxzjSGDFknG-5K8UvhbcUnw7-ewBy-rmVgS6ME9Z9KDkFJBBKW2C9EQAUlGNgy-H8TnMmA6GiDgBzY"
VAPID_CONTACT = "mailto:hello@barbart.ca"
ARTIST_SENDER = "Gallery <hello@barbart.ca>"
# TURNSTILE_SITE_KEY = ""  # public by design; empty = honeypot only
CF_ACCOUNT_ID = "ee6937662d7aeda01d2a6f1f49a1168a"  # feeds /admin "Most viewed"
CF_ANALYTICS_SITE = "ddd0b31f86c24e31a4fbabd86185e210"  # beacon token doubles as the site tag
# (CF_ANALYTICS_TOKEN is a secret: API token with Account Analytics: Read)

[[d1_databases]]
binding = "DB"
database_name = "art-gallery-db"
database_id = "108c5dee-b1a6-4837-8afb-6b2f0b4410ba"
# R2 is gone: painting photos live in git (responsive via astro:image),
# AR models in public/models. The bucket can be deleted in the dashboard.

